<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurudex</title>
    <script src="index.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/ultraball.png">
</head>

<body>

    <header>
        <a class="about" href="about.html"><img class="arrow" src="assets/arrow.png" alt="arrow"> INFO </a>
        <div class="searchbar">
            <input id="query" type="text" onkeydown="if (event.key === 'Enter') search()"></input>
            <button id="searchbtn" type="submit">Search</button>
        </div>
        <span class="lng">ENG</span>
    </header>
    <div id="errordiv">
        <div class="pkmnotfound">
            Pokemon not found
        </div>
    </div>
    <main>
        <div class="content">

            <div class="grid">
                <div class="sprite-container">
                    <img id="sprites" alt="misigno">
                    <div id="type">
                        <div id="type1" class="type"></div>
                        <div id="type2" class="type"></div>
                    </div>
                </div>
                <div id="principal">
                    <div id="ID">
                        <div class="topID">
                            <img class="pokeball" alt="pokeball">

                            <p id="pokenumber"></p>
                            <p id="name"></p>

                        </div>
                        <div class="bottomID">
                            <p id="genera"></p>
                        </div>
                    </div>
                    <div class="scream-type">

                        <div class="scream">
                            <div class="screamTop"></div>
                            <div class="sound-btn"></div>
                            <audio id="cry" src="assets/MissingNo.mp3"></audio>
                        </div>
                        <div id="H-W">
                            <div class="WT">
                                <div id="weight"></div>
                            </div>
                            <div class="HT">
                                <div id="height"></div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
            <div class="desc-border">
                <div id="description"></div>
            </div>
        </div>
    </main>

    <footer>
        <p></p>
    </footer>

</body>

</html>

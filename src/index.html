<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Vanilla Website</title>
    <script src="index.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <span><img class="arrow" src="arrow.png" alt="arrow"> INFO </span>
        <span class="lng">ENG</span>
    </header>

    <main>
        <div class="grid">

            <img id="sprites" src="misigno.png" alt="misigno">
            <div id="principal">
                <div id="ID">
                    <div class="topID">
                        <img class="pokeball" src="minipoke.png" alt="pokeball">

                        <p id="pokenumber">
                            676
                        </p>
                        <p id="name">
                            Crabominable
                        </p>

                    </div>
                    <div class="bottomID">
                        <p id="genera">
                            Unkown pokemon
                        </p>
                    </div>
                </div>

                <div class="scream">
                    <div class="screamTop"></div>
                    <div class="sound-btn"></div>
                    <audio id="cry" src="bone-crack.mp3"></audio>
                </div>
                <div id="type">
                    fairy - steel
                </div>
                <div id="H-W">
                    1 metro 10 kilos
                </div>

            </div>
        </div>
        <div id="description">
            the missile knows where it is.....
        </div>
    </main>

    <p id="pokemon"></p>

    <footer>
        <p>&copy; 2026 My Portfolio</p>
    </footer>

</body>

</html>
